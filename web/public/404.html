<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404: Page Not Found — Zoop Internet</title>
  <meta name="description" content="The page you are looking for does not exist on Zoop Internet. Return to the homepage or explore our documentation and downloads." />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Theme & Icons -->
  <meta name="theme-color" content="#0284c7" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/webp" sizes="32x32" href="/zoopicon-32.webp" />
  <link rel="icon" type="image/png" sizes="32x32" href="/zoopicon-32.png" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <style>
    :root {
      --bg: #020617;
      --card-bg: #0b1120;
      --border: rgba(255, 255, 255, 0.08);
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg);
      color: var(--text);
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 32px 20px;
      text-align: center;
      line-height: 1.5;
    }
    .brand-link {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      margin-bottom: 28px;
    }
    .brand-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--text);
    }
    .brand-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.28);
      padding: 2px 8px;
      border-radius: 999px;
    }
    .code-badge {
      font-size: 5.5rem;
      font-weight: 900;
      letter-spacing: -0.05em;
      color: var(--primary);
      line-height: 1;
      text-shadow: 0 0 40px rgba(56, 189, 248, 0.25);
    }
    h1 {
      font-size: 1.85rem;
      font-weight: 800;
      margin-top: 14px;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--text-muted);
      margin-top: 10px;
      max-width: 500px;
      font-size: 1rem;
    }
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-primary {
      padding: 12px 24px;
      border-radius: 10px;
      background: var(--primary);
      color: #020617;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9375rem;
      transition: background 0.15s ease;
    }
    .btn-primary:hover {
      background: var(--primary-hover);
      color: #ffffff;
    }
    .btn-secondary {
      padding: 12px 24px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.9375rem;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.18);
    }
    .quick-links {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 20px;
      font-size: 0.875rem;
      color: var(--text-muted);
      flex-wrap: wrap;
      justify-content: center;
    }
    .quick-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }
    .quick-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <a href="/" class="brand-link" aria-label="Zoop Internet Homepage">
    <img src="/zoopicon-32.webp" alt="Zoop Logo" width="32" height="32" />
    <span class="brand-title">Zoop</span>
    <span class="brand-badge">Internet</span>
  </a>

  <div class="code-badge">404</div>
  <h1>Page not found</h1>
  <p>The page you are looking for does not exist or has been moved. Check the URL or use the navigation below to find what you need.</p>

  <div class="actions">
    <a href="/" class="btn-primary">Go to Homepage</a>
    <a href="/docs" class="btn-secondary">Documentation</a>
    <a href="/downloads" class="btn-secondary">Downloads</a>
  </div>

  <nav class="quick-links" aria-label="Popular Pages">
    <a href="/how-it-works">How It Works</a>
    <span>·</span>
    <a href="/products">Products</a>
    <span>·</span>
    <a href="/pricing">Pricing</a>
    <span>·</span>
    <a href="/security">Security</a>
    <span>·</span>
    <a href="https://github.com/zoop-internet/zoop" target="_blank" rel="noreferrer">GitHub</a>
  </nav>
</body>
</html>
