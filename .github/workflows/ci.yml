name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: 1.22
          govulncheck-version: v1.1.3
          go-package: ./...

      - name: Run Linters
        run: make lint

      - name: Run Unit Tests
        run: make test

      - name: Build Binaries
        run: make build
