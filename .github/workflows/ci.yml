name: CI

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go Backend & Networking Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

      - name: Run Linters
        run: make lint

      - name: Run Unit Tests
        run: make test

      - name: Build Binaries
        run: make build

  cross-compile:
    name: Cross-Platform Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build Cloud for Linux (amd64)
        run: GOOS=linux GOARCH=amd64 go build -v -o /dev/null ./cmd/zoopspot-cloud

      - name: Build Cloud for Linux (arm64)
        run: GOOS=linux GOARCH=arm64 go build -v -o /dev/null ./cmd/zoopspot-cloud

      - name: Build Router Gateway for OpenWrt (MIPS)
        run: GOOS=linux GOARCH=mips go build -v -o /dev/null ./cmd/zoopspot-router

      - name: Build Router Gateway for OpenWrt (ARM64)
        run: GOOS=linux GOARCH=arm64 go build -v -o /dev/null ./cmd/zoopspot-router

  web:
    name: Web Dashboard Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run linter
        working-directory: web
        run: npm run lint

      - name: Type check and build web bundle
        working-directory: web
        env:
          VITE_API_BASE: https://3.70.135.200.sslip.io
        run: npm run build

      - name: Verify Web Build Assertions
        working-directory: web
        run: node scripts/verify-build.mjs
