name: Deploy Web to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to Cloudflare Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build Web App & Prerender
        working-directory: web
        env:
          VITE_API_BASE: https://3.70.135.200.sslip.io
        run: npm run build

      - name: Verify Web Build Assertions
        working-directory: web
        run: node scripts/verify-build.mjs

      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '7335973a10147fee3168dac18331dbab' }}
        run: |
          npx wrangler pages deploy dist --project-name=zoopnetwork --branch=main --commit-dirty=true
