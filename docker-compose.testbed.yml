version: '3.8'

networks:
  # The simulated public internet (WAN)
  zoop_wan:
    name: zoop_wan
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.0.0/16
  # The simulated standard home network (Port-Restricted NAT)
  zoop_lan_a:
    name: zoop_lan_a
    driver: bridge
    ipam:
      config:
        - subnet: 172.51.0.0/24
  # The simulated CGNAT / Symmetric network
  zoop_lan_b:
    name: zoop_lan_b
    driver: bridge
    ipam:
      config:
        - subnet: 172.52.0.0/24

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: zoop
      POSTGRES_PASSWORD: zoop_password
      POSTGRES_DB: zoop_db
    networks:
      zoop_wan:
        ipv4_address: 172.50.0.10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zoop -d zoop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6-alpine
    command: >
      -n
      --log-file=stdout
      --min-port=49152
      --max-port=65535
      --realm=zoop.network
      --use-auth-secret
      --static-auth-secret=zoop-turn-secret
      --stale-nonce
    networks:
      zoop_wan:
        ipv4_address: 172.50.0.11

  zoop-cloud:
    build:
      context: .
      dockerfile: docker/Dockerfile.cloud
      network: host
    environment:
      - ZOOP_STORE_TYPE=postgres
      - ZOOP_POSTGRES_URL=postgres://zoop:zoop_password@172.50.0.10:5432/zoop_db?sslmode=disable
      - ZOOP_TURN_SECRET=zoop-turn-secret
      - ZOOP_TURN_REALM=zoop.network
    networks:
      zoop_wan:
        ipv4_address: 172.50.0.12
    depends_on:
      postgres:
        condition: service_healthy

  router-a:
    build:
      context: docker
      dockerfile: Dockerfile.router
      network: host
    privileged: true
    cap_add:
      - NET_ADMIN
    environment:
      - NAT_TYPE=standard
    networks:
      zoop_wan:
        ipv4_address: 172.50.0.20
      zoop_lan_a:
        ipv4_address: 172.51.0.1

  router-b:
    build:
      context: docker
      dockerfile: Dockerfile.router
      network: host
    privileged: true
    cap_add:
      - NET_ADMIN
    environment:
      - NAT_TYPE=symmetric
    networks:
      zoop_wan:
        ipv4_address: 172.50.0.21
      zoop_lan_b:
        ipv4_address: 172.52.0.1

  agent-a:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      network: host
    privileged: true
    cap_add:
      - NET_ADMIN
    command: ["-api-port", "9090"]
    networks:
      zoop_lan_a:
        ipv4_address: 172.51.0.10
    depends_on:
      - zoop-cloud
      - router-a
    # We must alter the default route so traffic goes through the router instead of the docker bridge default gateway
    entrypoint: >
      /bin/sh -c "ip route del default && ip route add default via 172.51.0.1 && /bin/zoop-agent -api-port 9090 -tun zoopa"
    environment:
      - ZOOP_CONTROL_PLANE_URL=http://172.50.0.12:8080

  agent-b:
    build:
      context: .
      dockerfile: docker/Dockerfile.agent
      network: host
    privileged: true
    cap_add:
      - NET_ADMIN
    command: ["-api-port", "9090"]
    networks:
      zoop_lan_b:
        ipv4_address: 172.52.0.10
    depends_on:
      - zoop-cloud
      - router-b
    # We must alter the default route so traffic goes through the router instead of the docker bridge default gateway
    entrypoint: >
      /bin/sh -c "ip route del default && ip route add default via 172.52.0.1 && /bin/zoop-agent -api-port 9090 -tun zoopb"
    environment:
      - ZOOP_CONTROL_PLANE_URL=http://172.50.0.12:8080
